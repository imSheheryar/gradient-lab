[project]
name = "gradient-lab"
version = "0.1.0"
description = "A from-scratch reverse-mode autodiff engine, built to measure where gradients die"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "torch>=2.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
